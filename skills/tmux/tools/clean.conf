# Deterministic tmux config for agent pane scraping.
#
# Goal: a predictable, side-effect-free environment so send-keys and
# capture-pane behave identically regardless of the user's ~/.tmux.conf.
# This file is loaded via `tmux -S "$SOCKET" -f clean.conf new ...` so the
# user's personal config is never sourced.

# No status bar: reclaim the bottom row and avoid periodic redraws that
# race with capture-pane.
set -g status off

# No mouse: prevents accidental copy-mode / selection state during scraping.
set -g mouse off

# Do not let programs rename windows/panes or set the terminal title.
# Automatic renaming makes session:window.pane targets unstable.
setw -g automatic-rename off
set -g allow-rename off
set -g set-titles off
setw -g aggressive-resize off

# Keep panes around after the program exits so we can still capture output.
set -g remain-on-exit off
set -g destroy-unattached off

# Large scrollback so capture-pane -S can reach earlier output.
set -g history-limit 100000

# Predictable terminal and no escape-time guessing games with send-keys.
set -g default-terminal "xterm-256color"
set -sg escape-time 0

# Sane fixed geometry for detached sessions (deterministic wrapping).
set -g default-size 200x50
